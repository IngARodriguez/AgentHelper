services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agente-navegador
    env_file: .env
    environment:
      PORT: ${PORT:-8000}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-7}
      API_TOKEN: ${API_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      DISPLAY_WIDTH: ${DISPLAY_WIDTH:-1280}
      DISPLAY_HEIGHT: ${DISPLAY_HEIGHT:-800}
      DISPLAY_DEPTH: ${DISPLAY_DEPTH:-24}
      MAX_TOKENS: ${MAX_TOKENS:-8192}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-100}
      ACTION_DELAY_S: ${ACTION_DELAY_S:-0.4}
      KEEP_RECENT_SCREENSHOTS: ${KEEP_RECENT_SCREENSHOTS:-10}
      SCREENSHOT_FORMAT: ${SCREENSHOT_FORMAT:-jpeg}
      SCREENSHOT_QUALITY: ${SCREENSHOT_QUALITY:-90}
      ANTHROPIC_LOG: ${ANTHROPIC_LOG:-info}
    ports:
      # Single-port: dashboard + noVNC + WebSocket bridge bajo el mismo puerto
      - "${PORT:-8000}:${PORT:-8000}"
    shm_size: "1gb"
